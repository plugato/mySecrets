# Verificação contínua: roda em todo push para master e em pull requests.
# (Os instaladores e a release continuam no build.yml, por tag.)

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop, MCP e extensão (lint + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: App desktop de verdade (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome for Testing (aceita carregar a extensão; o Chrome oficial não)
        run: |
          SAIDA=$(npx -y @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" | tail -1)
          echo "CHROME_BIN=$(echo "$SAIDA" | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Testes ponta a ponta (app, extensão no Chrome e no Firefox)
        run: xvfb-run -a npm run test:e2e

  android:
    name: Android (testes + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários e Android Lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html

  segredos:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
