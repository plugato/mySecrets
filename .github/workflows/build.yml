# Build automático para Windows e Linux.
#
# - Push de tag vX.Y.Z  → builda e publica a release neste repositório
#   (de onde o electron-updater baixa as atualizações).
# - Execução manual (Actions → Build → Run workflow) → só builda e deixa os
#   instaladores como artefatos do workflow, sem publicar.

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não bate com a versão do package.json ($PKG)"
            exit 1
          fi

      # A loja só aceita versão nova: extensão alterada sem subir a versão do
      # manifest nunca chega aos usuários (o envio é pulado em silêncio).
      - name: Conferir versão da extensão
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux'
        shell: bash
        run: |
          git fetch --quiet --tags --unshallow 2>/dev/null || git fetch --quiet --tags
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -z "$PREV" ] || git diff --quiet "$PREV" HEAD -- chrome-extension ':!chrome-extension/*.md'; then
            exit 0
          fi
          ANTES=$(git show "$PREV:chrome-extension/manifest.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          AGORA=$(node -p 'require("./chrome-extension/manifest.json").version')
          if [ "$ANTES" = "$AGORA" ]; then
            echo "::error::chrome-extension/ mudou desde $PREV mas o manifest continua em $AGORA: suba a versão da extensão"
            exit 1
          fi

      - run: npm ci

      - name: Configurar login com Google
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e 'require("fs").writeFileSync("src/google-oauth.json", JSON.stringify({ clientId: process.env.GOOGLE_CLIENT_ID, clientSecret: process.env.GOOGLE_CLIENT_SECRET }))'
            echo "Login com Google habilitado neste build"
          else
            echo "::warning::Secrets GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET ausentes: build sem login com Google"
          fi

      - run: npm run lint

      - run: npm test

      - name: Build
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Empacotar extensão do Chrome
        if: matrix.platform == 'linux'
        working-directory: chrome-extension
        run: zip -r ../dist/MySecrets-Autofill-extensao-chrome.zip . -x "*.git*" "*README*.md" "TESTE*.md" "*.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: mysecrets-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  # App Android: APK assinado com a chave de release (secrets ANDROID_*).
  # O APK entra na mesma release do GitHub que os instaladores do desktop.
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não bate com a versão do package.json ($PKG)"
            exit 1
          fi

      - name: Chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente: sem ele o APK não pode ser assinado com a chave de release (rode scripts/android-secrets.sh)"
              exit 1
            fi
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: APK assinado com a chave de debug (só para teste)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Firebase (push que acorda o app quando o PC pede aprovação com o app fechado)
      - name: Configuração do Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON ausente: APK sem aprovação com o app fechado"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Testes e build
        working-directory: android
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -z "$GOOGLE_CLIENT_ID" ] && echo "::warning::Secrets GOOGLE_CLIENT_* ausentes: APK sem login com Google"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir -p ../dist
          VERSION="$(node -p "require('../package.json').version")"
          cp app/build/outputs/apk/release/MySecrets-*-release.apk "../dist/MySecrets-$VERSION-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: mysecrets-android
          if-no-files-found: error
          path: dist/*.apk

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Sem softprops/action-gh-release: ele envia os arquivos em paralelo e a API
      # do GitHub às vezes recusa ("Error updating policy"), deixando a release em
      # rascunho. Aqui: rascunho -> um arquivo por vez com novas tentativas -> publica.
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --draft --verify-tag --title "MySecrets $TAG" --notes ""
          fi
          for f in dist/*; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" -R "$REPO" --clobber; then ok=1; break; fi
              echo "::warning::Falha ao enviar $(basename "$f") (tentativa $i), repetindo..."
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "::error::Não foi possível enviar $(basename "$f")"; exit 1; }
          done
          gh release edit "$TAG" -R "$REPO" --draft=false --latest

  # Envia a extensão para a Chrome Web Store (só se os secrets CWS_* existirem).
  # Pula sozinho quando a versão do manifest já está na loja.
  chrome-web-store:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: mysecrets-linux
          path: dist

      - name: Enviar para a Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -z "$CWS_SERVICE_ACCOUNT_JSON" ] || [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$CWS_EXTENSION_ID" ]; then
            echo "::warning::Secrets CWS_* ausentes: extensão não enviada para a Chrome Web Store"
            exit 0
          fi
          node scripts/publish-chrome-extension.js dist/MySecrets-Autofill-extensao-chrome.zip
