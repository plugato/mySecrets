# Build automático para Windows e Linux.
#
# - Push de tag vX.Y.Z  → builda e publica a release neste repositório
#   (de onde o electron-updater baixa as atualizações).
# - Execução manual (Actions → Build → Run workflow) → só builda e deixa os
#   instaladores como artefatos do workflow, sem publicar.

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não bate com a versão do package.json ($PKG)"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Build
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Empacotar extensão do Chrome
        if: matrix.platform == 'linux'
        working-directory: chrome-extension
        run: zip -r ../dist/MySecrets-Autofill-extensao-chrome.zip . -x "*.git*" "*README*.md" "TESTE*.md" "*.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: mysecrets-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MySecrets ${{ github.ref_name }}
          files: dist/*
